<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyCarry — Premium Store</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =========================================
   1. GLOBAL STYLES & VARIABLES
   ========================================= */
:root {
  --primary: #0f3d2e;
  --primary-dark: #0b2e22;
  --accent: #c96a2e;
  --bg-light: #f6f5f1;
  --white: #ffffff;
  --text: #1a1d1b;
  --text-muted: #6b736d;
  --border: #e5e3dc;
  --danger: #d32f2f;
  --shadow: 0 4px 15px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
  --font-head: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); color: var(--text); background: var(--white); overflow-x: hidden; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; border: none; font-family: inherit; font-size: 14px; }
.hidden { display: none !important; }
.text-danger { color: var(--danger) !important; }

/* =========================================
   2. BUTTONS & FORMS
   ========================================= */
.btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; transition: all 0.3s ease; display: inline-block; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #b55c25; transform: translateY(-2px); box-shadow: var(--shadow); }
.btn-dark { background: var(--primary); color: white; }
.btn-dark:hover { background: var(--primary-dark); transform: translateY(-2px); }
.btn-danger { background: var(--danger); color: white; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.full-width { width: 100%; }

input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; background: #fbfbf9; transition: border 0.3s; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }

/* =========================================
   3. HEADER & NAVIGATION
   ========================================= */
header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
.header-wrap { max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
.logo { font-family: var(--font-head); font-size: 26px; font-weight: 700; cursor: pointer; }
.nav-links a { margin: 0 15px; font-weight: 500; transition: color 0.3s; }
.nav-links a:hover { color: var(--accent); }
.header-actions { display: flex; align-items: center; gap: 15px; }
.icon-btn { background: transparent; font-size: 18px; display: flex; align-items: center; gap: 5px; font-weight: 600; }

/* =========================================
   4. STOREFRONT SECTIONS
   ========================================= */
.section { padding: 60px 20px; max-width: 1240px; margin: 0 auto; }
.section-title { font-family: var(--font-head); font-size: 32px; margin-bottom: 30px; text-align: center; }
.bg-light { background: var(--bg-light); max-width: 100%; }

/* Circular Categories Reel */
.category-reel { display: flex; gap: 25px; overflow-x: auto; padding: 20px 0; scroll-behavior: smooth; scrollbar-width: none; }
.category-reel::-webkit-scrollbar { display: none; }
.cat-circle { flex: 0 0 120px; height: 120px; border-radius: 50%; border: 3px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.3s ease; position: relative; }
.cat-circle:hover { border-color: var(--accent); transform: scale(1.05); }
.cat-circle img { width: 100%; height: 100%; object-fit: cover; }

/* Product Grid */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
.prod-card { background: white; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; transition: 0.3s; }
.prod-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
.prod-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
.prod-info { padding: 20px; }
.prod-title { font-family: var(--font-head); font-size: 18px; font-weight: 600; margin-bottom: 5px; }
.prod-price { color: var(--accent); font-weight: 700; font-size: 18px; }
.prod-old { text-decoration: line-through; color: var(--text-muted); font-size: 14px; margin-left: 8px; }

/* =========================================
   5. MODALS (Auth)
   ========================================= */
.modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal-content { background: white; padding: 30px; border-radius: var(--radius); width: 100%; max-width: 400px; position: relative; transform: translateY(20px); transition: 0.3s; }
.modal-overlay.active .modal-content { transform: translateY(0); }
.modal-content.dark-mode { background: #1a1d1b; color: white; }
.modal-content.dark-mode input { background: #333; border-color: #444; color: white; }
.close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; background: transparent; color: inherit; }

/* =========================================
   6. DASHBOARDS (Admin & Customer)
   ========================================= */
.dashboard-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-light); display: flex; z-index: 2000; overflow: hidden; }
.dash-sidebar { width: 260px; background: var(--primary); color: white; padding: 20px 0; display: flex; flex-direction: column; overflow-y: auto; }
.dash-sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
.dash-sidebar button { background: transparent; color: #ccc; text-align: left; padding: 15px 20px; transition: 0.3s; border-left: 4px solid transparent; font-size: 15px; font-weight: 500; }
.dash-sidebar button:hover, .dash-sidebar button.active { background: rgba(255,255,255,0.05); color: white; border-left-color: var(--accent); }
.dash-main { flex: 1; padding: 40px; overflow-y: auto; }
.admin-sidebar { background: #111; }

/* Dashboard Cards */
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: white; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
.stat-card h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.stat-card .value { font-size: 28px; font-weight: 700; color: var(--primary); }

/* Table */
.data-table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.data-table th, .data-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
.data-table th { background: #f9f9f9; font-weight: 600; color: var(--text-muted); font-size: 13px; text-transform: uppercase; }

/* Responsive */
@media (max-width: 768px) {
  .header-wrap { flex-direction: column; gap: 15px; }
  .dashboard-overlay { flex-direction: column; }
  .dash-sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; }
  .dash-sidebar .logo, .dash-sidebar hr { display: none; }
  .dash-sidebar button { border-left: none; border-bottom: 4px solid transparent; padding: 10px; white-space: nowrap; }
  .dash-sidebar button.active { border-bottom-color: var(--accent); }
}
</style>
</head>
<body>

<!-- =========================================
     MAIN STOREFRONT UI
     ========================================= -->
<header>
  <div class="header-wrap">
    <div class="logo" onclick="location.reload()">CozyCarry</div>
    <nav class="nav-links">
      <a href="#shop">Shop</a>
      <a href="#categories">Categories</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn">🔍</button>
      <button class="icon-btn">♡ <span id="wishCount">0</span></button>
      <button class="icon-btn">🛍️ <span id="cartCount">0</span></button>
      <button class="btn btn-primary" onclick="showAuth('customer')">Login / Signup</button>
      <button class="btn btn-dark" onclick="showAuth('admin')">Admin</button>
    </div>
  </div>
</header>

<section id="categories" class="section">
  <h2 class="section-title">Shop by Category</h2>
  <div class="category-reel" id="categoryReel">
    <!-- JS Populated -->
  </div>
</section>

<section id="shop" class="section bg-light">
  <h2 class="section-title">Our Collection</h2>
  <div class="product-grid" id="productGrid">
    <!-- JS Populated -->
  </div>
</section>

<!-- =========================================
     AUTH MODALS
     ========================================= -->
<div id="customerModal" class="modal-overlay">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('customerModal')">×</button>
    <h2 id="custModalTitle">Customer Login</h2>
    <form id="customerAuthForm" onsubmit="handleAuth(event, 'customer')">
      <input type="text" id="custName" placeholder="Full Name" class="hidden">
      <input type="email" id="custEmail" placeholder="Email Address" required>
      <input type="password" id="custPass" placeholder="Password" required>
      <button type="submit" class="btn btn-primary full-width" id="custAuthBtn">Sign In</button>
    </form>
    <p style="text-align:center; margin-top:15px; font-size:14px;">
      <span id="custToggleText">New here?</span> <a href="#" onclick="toggleAuthMode('customer')" style="color:var(--accent); font-weight:600;">Register</a>
    </p>
  </div>
</div>

<div id="adminModal" class="modal-overlay">
  <div class="modal-content dark-mode">
    <button class="close-btn" onclick="closeModal('adminModal')">×</button>
    <h2>Admin Portal</h2>
    <form id="adminAuthForm" onsubmit="handleAuth(event, 'admin')">
      <input type="email" id="adminEmail" placeholder="Admin Email" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit" class="btn btn-danger full-width">Access Control Center</button>
    </form>
  </div>
</div>

<!-- =========================================
     CUSTOMER DASHBOARD
     ========================================= -->
<div id="customerDashboard" class="dashboard-overlay hidden">
  <aside class="dash-sidebar">
    <h2 class="logo">My Account</h2>
    <button class="active" onclick="loadCustTab('overview', this)">Overview</button>
    <button onclick="loadCustTab('orders', this)">My Orders</button>
    <button onclick="loadCustTab('wishlist', this)">Wishlist</button>
    <button onclick="loadCustTab('profile', this)">Profile</button>
    <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
    <button class="text-danger" onclick="logout()">Sign Out</button>
  </aside>
  <main class="dash-main" id="custContent">
    <h2>Welcome Back!</h2>
  </main>
</div>

<!-- =========================================
     ADMIN DASHBOARD
     ========================================= -->
<div id="adminDashboard" class="dashboard-overlay hidden">
  <aside class="dash-sidebar admin-sidebar">
    <h2 class="logo">CozyCarry Admin</h2>
    <small id="adminRoleBadge" style="padding:0 20px 15px; color:#aaa;">Role: Admin</small>
    <button class="active" onclick="loadAdminTab('overview', this)">Dashboard</button>
    <button onclick="loadAdminTab('products', this)">Products</button>
    <button onclick="loadAdminTab('categories', this)">Categories</button>
    <button onclick="loadAdminTab('orders', this)">Orders</button>
    <hr style="border-color:rgba(255,255,255,0.1); margin:10px 0;">
    <button class="text-danger" onclick="logout()">Sign Out</button>
  </aside>
  <main class="dash-main" id="adminContent">
    <h2>Dashboard</h2>
  </main>
</div>

<script>
/* =========================================
   SUPABASE CONFIG & GLOBALS
   ========================================= */
const SUPABASE_URL = "https://tjekrbmmkqxrdqtmxdmz.supabase.co";
const SUPABASE_KEY = "sb_publishable_S2GWeU3hgtnsDRGCR4mG6g_HqP-XjIY"; // <--- Replace with real anon key
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let userRole = 'customer';
let isSignupMode = false;

/* =========================================
   INITIALIZATION
   ========================================= */
document.addEventListener("DOMContentLoaded", async () => {
  await checkSession();
  await loadStorefrontData();
  startCategoryReel();
});

/* =========================================
   MODALS & NAVIGATION
   ========================================= */
function showAuth(type) {
  if (type === 'customer') document.getElementById('customerModal').classList.add('active');
  if (type === 'admin') document.getElementById('adminModal').classList.add('active');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}
function toggleAuthMode(type) {
  isSignupMode = !isSignupMode;
  document.getElementById('custName').classList.toggle('hidden', !isSignupMode);
  document.getElementById('custModalTitle').textContent = isSignupMode ? "Create Account" : "Customer Login";
  document.getElementById('custAuthBtn').textContent = isSignupMode ? "Sign Up" : "Sign In";
  document.getElementById('custToggleText').textContent = isSignupMode ? "Already have an account?" : "New here?";
  document.querySelector('#customerModal a').textContent = isSignupMode ? "Sign In" : "Register";
}

/* =========================================
   AUTHENTICATION LOGIC
   ========================================= */
async function checkSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    currentUser = session.user;
    const { data: profile } = await db.from('profiles').select('role').eq('id', currentUser.id).maybeSingle();
    userRole = profile?.role || 'customer';
  }
}

async function handleAuth(e, type) {
  e.preventDefault();
  const email = type === 'customer' ? document.getElementById('custEmail').value : document.getElementById('adminEmail').value;
  const password = type === 'customer' ? document.getElementById('custPass').value : document.getElementById('adminPass').value;
  const name = document.getElementById('custName').value;

  if (type === 'customer' && isSignupMode) {
    // Signup logic
    const { data, error } = await db.auth.signUp({ 
      email, password, 
      options: { data: { full_name: name, role: 'customer' } } 
    });
    if (error) return alert(error.message);
    alert("Account created! You can now sign in.");
    toggleAuthMode('customer');
    return;
  }

  // Login Logic
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) return alert(error.message);

  // Fetch Role from DB
  const { data: profile } = await db.from('profiles').select('role, full_name').eq('id', data.user.id).maybeSingle();
  const role = profile?.role || 'customer';

  if (type === 'admin' && !['admin', 'super_admin', 'product_manager'].includes(role)) {
    alert("Unauthorized: You do not have admin access.");
    await db.auth.signOut();
    return;
  }
  if (type === 'customer' && ['admin', 'super_admin'].includes(role)) {
    alert("Please use the Admin login button.");
    await db.auth.signOut();
    return;
  }

  currentUser = data.user;
  userRole = role;
  closeModal('customerModal');
  closeModal('adminModal');
  
  if (type === 'admin') openAdminDashboard();
  else openCustomerDashboard();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

/* =========================================
   DASHBOARD ROUTING & TABS
   ========================================= */
function openCustomerDashboard() {
  document.getElementById('customerDashboard').classList.remove('hidden');
  loadCustTab('overview', document.querySelector('#customerDashboard .dash-sidebar button'));
}
function openAdminDashboard() {
  document.getElementById('adminDashboard').classList.remove('hidden');
  document.getElementById('adminRoleBadge').textContent = `Role: ${userRole.toUpperCase()}`;
  loadAdminTab('overview', document.querySelector('#adminDashboard .dash-sidebar button'));
}

// Customer Tabs
async function loadCustTab(tab, btn) {
  document.querySelectorAll('#customerDashboard .dash-sidebar button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const content = document.getElementById('custContent');
  content.innerHTML = '<p>Loading...</p>';

  if (tab === 'overview') {
    content.innerHTML = `<h2>Welcome Back!</h2><p>Logged in as: <b>${currentUser.email}</b></p>`;
  } 
  else if (tab === 'orders') {
    const { data: orders } = await db.from('orders').select('*').eq('user_id', currentUser.id).order('created_at', {ascending: false});
    if (!orders || orders.length === 0) {
      content.innerHTML = `<h2>My Orders</h2><p>You have no orders yet.</p>`;
      return;
    }
    content.innerHTML = `<h2>My Orders</h2>
      <table class="data-table">
        <tr><th>Order ID</th><th>Date</th><th>Status</th><th>Total</th></tr>
        ${orders.map(o => `<tr><td>${o.order_code}</td><td>${new Date(o.created_at).toLocaleDateString()}</td><td><span style="background:#eee;padding:4px 8px;border-radius:4px;font-size:12px;">${o.status}</span></td><td>Rs. ${o.total}</td></tr>`).join('')}
      </table>`;
  }
  else if (tab === 'profile') {
    content.innerHTML = `<h2>My Profile</h2>
      <div style="background:white; padding:20px; border-radius:12px; max-width:400px; border:1px solid var(--border);">
        <p><b>Email:</b> ${currentUser.email}</p>
        <p style="margin-top:10px;"><b>Account Type:</b> ${userRole}</p>
      </div>`;
  }
}

// Admin Tabs
async function loadAdminTab(tab, btn) {
  document.querySelectorAll('#adminDashboard .dash-sidebar button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const content = document.getElementById('adminContent');
  content.innerHTML = '<p>Loading data...</p>';

  if (tab === 'overview') {
    const { count: prodCount } = await db.from('products').select('*', { count: 'exact', head: true });
    const { count: ordCount } = await db.from('orders').select('*', { count: 'exact', head: true });
    
    content.innerHTML = `<h2>Dashboard Overview</h2>
      <div class="stat-cards">
        <div class="stat-card"><h3>Total Products</h3><div class="value">${prodCount || 0}</div></div>
        <div class="stat-card"><h3>Total Orders</h3><div class="value">${ordCount || 0}</div></div>
      </div>
      <p style="color:var(--text-muted); margin-top:20px;">Select an option from the left menu to manage your store.</p>`;
  }
  else if (tab === 'products') {
    const { data: prods } = await db.from('products').select('*').order('created_at', {ascending: false});
    content.innerHTML = `<h2>Products Management</h2>
      <button class="btn btn-primary" style="margin-bottom:20px;" onclick="alert('Add product form coming soon in next update!')">+ Add New Product</button>
      <table class="data-table">
        <tr><th>Image</th><th>Name</th><th>Price</th><th>Status</th></tr>
        ${prods?.map(p => `
          <tr>
            <td><img src="${p.cover_image || p.images?.[0]}" style="width:40px;height:40px;border-radius:4px;object-fit:cover;"></td>
            <td>${p.name}</td>
            <td>Rs. ${p.price}</td>
            <td>${p.is_active ? '<span style="color:green;">Active</span>' : 'Inactive'}</td>
          </tr>
        `).join('') || '<tr><td colspan="4">No products found in database.</td></tr>'}
      </table>`;
  }
  else if (tab === 'categories') {
    const { data: cats } = await db.from('categories').select('*');
    content.innerHTML = `<h2>Categories</h2>
      <table class="data-table">
        <tr><th>Image</th><th>Name</th><th>Subcategories</th></tr>
        ${cats?.map(c => `
          <tr>
            <td><img src="${c.image_url}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;"></td>
            <td>${c.name}</td>
            <td>${c.subcategories?.join(', ') || 'None'}</td>
          </tr>
        `).join('') || '<tr><td colspan="3">No categories found.</td></tr>'}
      </table>`;
  }
}

/* =========================================
   STOREFRONT DATA & UI
   ========================================= */
async function loadStorefrontData() {
  // Categories
  const { data: cats } = await db.from('categories').select('*').eq('is_active', true);
  const catReel = document.getElementById('categoryReel');
  if (cats && cats.length > 0) {
    catReel.innerHTML = cats.map(c => `
      <div class="cat-circle" onclick="alert('Filtering by ${c.name} (Demo)')">
        <img src="${c.image_url || 'https://via.placeholder.com/150'}" alt="${c.name}">
      </div>
    `).join('');
  } else {
    catReel.innerHTML = '<p style="color:#666;">No categories found in database.</p>';
  }

  // Products
  const { data: prods } = await db.from('products').select('*').eq('is_active', true).order('created_at', {ascending: false});
  const prodGrid = document.getElementById('productGrid');
  if (prods && prods.length > 0) {
    prodGrid.innerHTML = prods.map(p => `
      <div class="prod-card">
        <img src="${p.cover_image || p.images?.[0] || 'https://via.placeholder.com/300'}" class="prod-img" alt="${p.name}">
        <div class="prod-info">
          <div class="prod-title">${p.name}</div>
          <div style="margin-bottom:10px;">
            <span class="prod-price">Rs. ${p.price}</span>
            ${p.old_price ? `<span class="prod-old">Rs. ${p.old_price}</span>` : ''}
          </div>
          <button class="btn btn-dark full-width" onclick="alert('Cart feature coming soon!')">Add to Cart</button>
        </div>
      </div>
    `).join('');
  } else {
    prodGrid.innerHTML = '<p style="text-align:center;width:100%;color:#666;">No active products found. Add products from Admin Panel.</p>';
  }
}

// Auto-scroll category reel
function startCategoryReel() {
  const reel = document.getElementById('categoryReel');
  let scrollAmount = 1;
  let isHovered = false;

  reel.addEventListener('mouseenter', () => isHovered = true);
  reel.addEventListener('mouseleave', () => isHovered = false);

  function scroll() {
    if (!isHovered && reel.scrollWidth > reel.clientWidth) {
      reel.scrollLeft += scrollAmount;
      if (reel.scrollLeft >= reel.scrollWidth - reel.clientWidth) {
        reel.scrollLeft = 0; // Loop back to start
      }
    }
    requestAnimationFrame(scroll);
  }
  scroll();
}
</script>
</body>
</html>
