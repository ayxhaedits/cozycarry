<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyCarry — Premium Store</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
<!-- Storefront Header -->
<header id="mainHeader">
  <div class="header-wrap">
    <div class="logo" id="siteLogo">CozyCarry</div>
    <nav class="nav-links">
      <a href="#shop">Shop</a>
      <a href="#categories">Categories</a>
      <a href="#featured">Featured</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSearch()">🔍</button>
      <button class="icon-btn" onclick="showWishlist()">♡ <span id="wishCount">0</span></button>
      <button class="icon-btn cart-btn" onclick="showCart()">🛍️ <span id="cartCount">0</span></button>
      <button class="btn-primary" onclick="showCustomerAuth()">Login / Signup</button>
      <button class="btn-dark" onclick="showAdminAuth()">Admin</button>
    </div>
  </div>
</header>

<!-- Circular Categories (Requirement #2) -->
<section id="categories" class="section">
  <h2 class="section-title">Shop by Category</h2>
  <div class="category-reel" id="categoryReel">
    <!-- JS will populate circular cards here -->
  </div>
</section>

<!-- Hero & Products -->
<section id="shop" class="section bg-light">
  <h2 class="section-title">Our Collection</h2>
  <div class="product-grid" id="productGrid">
    <!-- JS will populate products -->
  </div>
</section>

<!-- Customer Auth Modal -->
<div id="customerModal" class="modal-overlay">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal('customerModal')">×</span>
    <h2>Customer Login</h2>
    <form id="customerAuthForm" onsubmit="handleCustomerAuth(event)">
      <input type="email" id="custEmail" placeholder="Email" required>
      <input type="password" id="custPass" placeholder="Password" required>
      <button type="submit" class="btn-primary full-width">Sign In</button>
    </form>
    <p style="text-align:center; margin-top:15px;">New here? <a href="#" onclick="toggleCustMode()">Register</a></p>
  </div>
</div>

<!-- Separate Admin Auth Modal (Requirement #4) -->
<div id="adminModal" class="modal-overlay">
  <div class="modal-content dark-mode">
    <span class="close-btn" onclick="closeModal('adminModal')">×</span>
    <h2>Admin Login</h2>
    <form id="adminAuthForm" onsubmit="handleAdminAuth(event)">
      <input type="email" id="adminEmail" placeholder="Admin Email" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit" class="btn-danger full-width">Access Dashboard</button>
    </form>
  </div>
</div>

<!-- CUSTOMER DASHBOARD (Hidden by default) -->
<div id="customerDashboard" class="dashboard-overlay hidden">
  <aside class="dash-sidebar">
    <h2 class="logo">My Account</h2>
    <button class="active" onclick="loadCustTab('overview')">Overview</button>
    <button onclick="loadCustTab('orders')">My Orders</button>
    <button onclick="loadCustTab('wishlist')">Wishlist</button>
    <button onclick="loadCustTab('profile')">Profile</button>
    <hr style="border-color:#333">
    <button class="text-danger" onclick="logout()">Sign Out</button>
  </aside>
  <main class="dash-main" id="custContent">
    <!-- Customer content goes here -->
  </main>
</div>

<!-- ADMIN DASHBOARD (Hidden by default) -->
<div id="adminDashboard" class="dashboard-overlay hidden">
  <aside class="dash-sidebar admin-sidebar">
    <h2 class="logo">CozyCarry Admin</h2>
    <small id="adminRoleBadge">Loading...</small>
    <button class="active" onclick="loadAdminTab('overview')">Dashboard</button>
    <button onclick="loadAdminTab('products')">Products</button>
    <button onclick="loadAdminTab('categories')">Categories</button>
    <button onclick="loadAdminTab('orders')">Orders</button>
    <button onclick="loadAdminTab('customers')">Customers</button>
    <button onclick="loadAdminTab('reports')">Reports</button>
    <button onclick="loadAdminTab('central')">Central Brain</button>
    <hr style="border-color:#333">
    <button class="text-danger" onclick="logout()">Sign Out</button>
  </aside>
  <main class="dash-main" id="adminContent">
    <!-- Admin content goes here -->
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
